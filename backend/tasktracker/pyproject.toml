[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "0.1.0"
description = "CLI task tracker from roadmap.sh"
requires-python = ">=3.8"

[project.scripts]
task-cli = "task_cli:main"

[tool.setuptools]
py-modules = ["task_cli", "taskTracker", "messages"]